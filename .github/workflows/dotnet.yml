name: publish

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet publish MSFSVariableWatcher -r win-x64 -o publish -p:PublishSingleFile=true --self-contained true
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MSFSVariableWatcher
        path: |
          ${{ github.workspace }}/publish/

  release:
    # Runs only when a version tag (v*) is pushed. Builds the standalone exe and
    # attaches it to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Publish standalone (self-contained, single file)
      run: dotnet publish MSFSVariableWatcher -r win-x64 -o publish -p:PublishSingleFile=true --self-contained true
    - name: Zip release
      shell: pwsh
      run: Compress-Archive -Path publish/* -DestinationPath "MSFSVariableWatcher-${{ github.ref_name }}-win-x64.zip"
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: MSFSVariableWatcher-${{ github.ref_name }}-win-x64.zip
        generate_release_notes: true
